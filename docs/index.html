<meta charset="utf-8">
<title>Taalai's AI Hardware Co.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap">

<style>
  /* Layout: centered single column, status-board aesthetic — light-first */
  :root {
    --bg:          #EEF3FF;
    --surface:     #FFFFFF;
    --surface-2:   #E4ECFF;
    --border:      #C8D6F5;
    --fg:          #0C1733;
    --fg-muted:    #5A6D96;
    --accent:      #2255E0;
    --accent-glow: rgba(34,85,224,.12);
    --open:        #0D7A43;
    --open-glow:   rgba(13,122,67,.12);
    --closed:      #C0272D;
    --closed-glow: rgba(192,39,45,.10);
    --time:        #2255E0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #060B18;
      --surface:     #0E1628;
      --surface-2:   #162035;
      --border:      #1F2F4A;
      --fg:          #DCE8FF;
      --fg-muted:    #5C7098;
      --accent:      #4A90FF;
      --accent-glow: rgba(74,144,255,.18);
      --open:        #2FCD6E;
      --open-glow:   rgba(47,205,110,.18);
      --closed:      #FF5F5F;
      --closed-glow: rgba(255,95,95,.18);
      --time:        #A0BFFF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:          #060B18;
    --surface:     #0E1628;
    --surface-2:   #162035;
    --border:      #1F2F4A;
    --fg:          #DCE8FF;
    --fg-muted:    #5C7098;
    --accent:      #4A90FF;
    --accent-glow: rgba(74,144,255,.18);
    --open:        #2FCD6E;
    --open-glow:   rgba(47,205,110,.18);
    --closed:      #FF5F5F;
    --closed-glow: rgba(255,95,95,.18);
    --time:        #A0BFFF;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-block: 48px;
    padding-left:  max(16px, env(safe-area-inset-left,  0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .store-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .system-label {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: .12em;
    color: var(--fg-muted);
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── Status card ── */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
    transition: box-shadow .4s;
  }
  .status-card.is-open {
    box-shadow: 0 0 40px var(--open-glow), inset 0 0 1px var(--open);
    border-color: rgba(47,205,110,.35);
  }
  .status-card.is-closed {
    box-shadow: 0 0 40px var(--closed-glow);
    border-color: rgba(255,95,95,.2);
  }

  .indicator {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    transition: background .4s, box-shadow .4s;
  }
  .is-open  .indicator { background: var(--open-glow);   box-shadow: 0 0 24px var(--open-glow);   }
  .is-closed .indicator { background: var(--closed-glow); box-shadow: 0 0 24px var(--closed-glow); }

  .status-pill {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 700;
  }
  .is-open  .status-pill { color: var(--open);   background: var(--open-glow);   }
  .is-closed .status-pill { color: var(--closed); background: var(--closed-glow); }

  .status-heading {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: -.02em;
    text-wrap: balance;
    line-height: 1.2;
  }

  .status-sub {
    color: var(--fg-muted);
    font-size: .9rem;
    line-height: 1.5;
    max-width: 32ch;
    text-wrap: balance;
  }

  /* Live clock */
  .live-clock {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--time);
    letter-spacing: .05em;
    font-variant-numeric: tabular-nums;
  }
  .clock-tz {
    font-size: .65rem;
    letter-spacing: .12em;
    color: var(--fg-muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Countdown */
  .countdown-label {
    font-size: .8rem;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-family: 'Space Mono', monospace;
  }
  .countdown-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: .04em;
    margin-top: 4px;
  }

  /* CTA button */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: .95rem;
    padding: 12px 24px;
    border-radius: 10px;
    transition: opacity .15s, transform .15s;
  }
  .cta-btn:hover { opacity: .88; transform: translateY(-1px); }

  /* ── Hours grid ── */
  .hours-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
  }
  .hours-title {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 14px;
  }
  .hours-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .day-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .day-bar {
    width: 100%;
    height: 48px;
    border-radius: 6px;
    background: var(--surface-2);
    position: relative;
    overflow: hidden;
  }
  .day-col.active .day-bar {
    background: var(--accent-glow);
    border: 1px solid rgba(74,144,255,.3);
  }
  .day-col.today .day-label { color: var(--accent); font-weight: 700; }
  .day-col.today .day-bar {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .day-hours {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    color: var(--fg-muted);
    text-align: center;
    line-height: 1.4;
  }
  .day-col.active .day-hours { color: var(--accent); }
  .day-col.off .day-hours { color: var(--fg-muted); opacity: .5; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    color: var(--fg-muted);
    font-size: .8rem;
    line-height: 1.6;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .status-card, .indicator, .cta-btn { transition: none; }
  }
</style>

<div class="wrap">

  <div class="header">
    <div class="store-name">Taalai's AI Hardware Co.</div>
    <div class="system-label">System Status</div>
  </div>

  <div class="status-card" id="statusCard">
    <div class="indicator" id="indicatorIcon"></div>
    <div>
      <div class="status-pill" id="statusPill"></div>
    </div>
    <div>
      <div class="live-clock" id="liveClock">--:--:--</div>
      <div class="clock-tz">Chicago / CST</div>
    </div>
    <div class="status-heading" id="statusHeading"></div>
    <div class="status-sub" id="statusSub"></div>
    <div id="countdownBlock" hidden>
      <div class="countdown-label">Opens in</div>
      <div class="countdown-value" id="countdownValue">--:--:--</div>
    </div>
    <a class="cta-btn" id="ctaBtn" href="https://aistore.auroradeploy.com" target="_blank" rel="noopener" hidden>
      Visit the store →
    </a>
  </div>

  <div class="hours-card">
    <div class="hours-title">Operating Hours — Mon to Fri · 7 am – 6 pm CST</div>
    <div class="hours-grid" id="hoursGrid"></div>
  </div>

  <div class="footer">
    Live site: <a href="https://aistore.auroradeploy.com" target="_blank" rel="noopener">aistore.auroradeploy.com</a><br>
    Available weekdays 7 am – 6 pm Central Time
  </div>

</div>

<script>
  const OPEN_HOUR  = 7;   // 7 am CST
  const CLOSE_HOUR = 18;  // 6 pm CST
  const TZ = 'America/Chicago';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const LIVE_URL = 'https://aistore.auroradeploy.com';

  function chicagoDate() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ,
      hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      weekday: 'short'
    }).formatToParts(now);
    const p = {};
    parts.forEach(({ type, value }) => p[type] = value);
    return {
      year:    parseInt(p.year),
      month:   parseInt(p.month) - 1,
      day:     parseInt(p.day),
      hour:    parseInt(p.hour) === 24 ? 0 : parseInt(p.hour),
      minute:  parseInt(p.minute),
      second:  parseInt(p.second),
      weekday: p.weekday,  // 'Mon', 'Tue', …
      dowIndex: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function isBusinessDay(dowIndex) {
    return dowIndex >= 1 && dowIndex <= 5; // Mon=1 … Fri=5
  }

  function isOpen(c) {
    return isBusinessDay(c.dowIndex) && c.hour >= OPEN_HOUR && c.hour < CLOSE_HOUR;
  }

  // Returns ms until next opening
  function msUntilOpen(c) {
    const now = new Date();
    // Try today first (before 7am on a weekday)
    let candidate = new Date(now);
    candidate = new Date(now.toLocaleString('en-US', {timeZone: TZ})); // local equiv
    // Build a Date at OPEN_HOUR today in Chicago timezone
    // Easiest: iterate days forward
    for (let daysAhead = 0; daysAhead <= 6; daysAhead++) {
      const trial = new Date(now.getTime() + daysAhead * 86400000);
      const tc = chicagoDateOf(trial);
      if (!isBusinessDay(tc.dowIndex)) continue;
      // Target = OPEN_HOUR:00 that day in Chicago
      const openMs = chicagoMidnight(trial) + OPEN_HOUR * 3600000;
      if (openMs > now.getTime()) return openMs - now.getTime();
    }
    return null;
  }

  function chicagoDateOf(d) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      weekday: 'short'
    }).formatToParts(d);
    const p = {};
    parts.forEach(({ type, value }) => p[type] = value);
    return {
      year:    parseInt(p.year),
      month:   parseInt(p.month) - 1,
      day:     parseInt(p.day),
      hour:    parseInt(p.hour) === 24 ? 0 : parseInt(p.hour),
      minute:  parseInt(p.minute),
      second:  parseInt(p.second),
      weekday: p.weekday,
      dowIndex: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoMidnight(d) {
    // Returns UTC ms of midnight in Chicago on the same calendar day as d
    const tc = chicagoDateOf(d);
    // Get the Chicago UTC offset for this date (handles DST correctly)
    const offsetStr = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, timeZoneName: 'shortOffset'
    }).formatToParts(d).find(p => p.type === 'timeZoneName').value;
    // offsetStr is like "GMT-6" or "GMT-5"
    const match = offsetStr.match(/GMT([+-])(\d+)(?::(\d+))?/);
    if (!match) return NaN;
    const sign = match[1];
    const hrs  = String(match[2]).padStart(2, '0');
    const mins = String(match[3] || '0').padStart(2, '0');
    // Build ISO string with explicit offset so new Date() parses it correctly
    const iso = `${tc.year}-${String(tc.month+1).padStart(2,'0')}-${String(tc.day).padStart(2,'0')}T00:00:00${sign}${hrs}:${mins}`;
    return new Date(iso).getTime();
  }

  function formatCountdown(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function buildHoursGrid(todayDow) {
    const grid = document.getElementById('hoursGrid');
    DAYS.forEach((day, i) => {
      const active = i >= 1 && i <= 5;
      const today  = i === todayDow;
      const col    = document.createElement('div');
      col.className = 'day-col' + (active ? ' active' : ' off') + (today ? ' today' : '');
      col.innerHTML = `
        <div class="day-label">${day}</div>
        <div class="day-bar"></div>
        <div class="day-hours">${active ? '7a–6p' : '—'}</div>
      `;
      grid.appendChild(col);
    });
  }

  function tick() {
    const c = chicagoDate();
    const h12 = c.hour % 12 === 0 ? 12 : c.hour % 12;
    const ampm = c.hour < 12 ? 'AM' : 'PM';
    document.getElementById('liveClock').textContent =
      `${String(h12).padStart(2,'0')}:${String(c.minute).padStart(2,'0')}:${String(c.second).padStart(2,'0')} ${ampm}`;

    const card     = document.getElementById('statusCard');
    const pill     = document.getElementById('statusPill');
    const heading  = document.getElementById('statusHeading');
    const sub      = document.getElementById('statusSub');
    const ctaBtn   = document.getElementById('ctaBtn');
    const cdBlock  = document.getElementById('countdownBlock');
    const cdValue  = document.getElementById('countdownValue');
    const indicator = document.getElementById('indicatorIcon');

    if (isOpen(c)) {
      card.className = 'status-card is-open';
      indicator.textContent = '⚡';
      pill.textContent = 'Live now';
      heading.textContent = 'Store is open';
      sub.textContent = `We're online and taking orders today until 6:00 PM CST.`;
      ctaBtn.hidden = false;
      cdBlock.hidden = true;
    } else {
      card.className = 'status-card is-closed';
      indicator.textContent = '🔒';
      pill.textContent = 'Offline';
      heading.textContent = 'Closed for now';
      sub.textContent = `The store runs on a scheduled window to keep costs low — weekdays 7 AM to 6 PM CST. It'll be back up at the next opening.`;
      ctaBtn.hidden = true;
      cdBlock.hidden = false;
      const ms = msUntilOpen(c);
      cdValue.textContent = ms ? formatCountdown(ms) : '--:--:--';
    }
  }

  // Build grid once
  buildHoursGrid(chicagoDate().dowIndex);
  // Start ticking
  tick();
  setInterval(tick, 1000);
</script>
