<meta charset="utf-8">
<title>Taalai's AI Hardware Co.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">

<style>
  :root {
    --bg:          #EEF2FF;
    --surface:     #FFFFFF;
    --surface-2:   #E0E9FF;
    --border:      #BDD0F8;
    --fg:          #0C1733;
    --fg-muted:    #4D6A9A;
    --accent:      #2255E0;
    --accent-dim:  rgba(34,85,224,.12);
    --accent-glow: rgba(34,85,224,.20);
    --open:        #0D7A43;
    --open-glow:   rgba(13,122,67,.16);
    --closed:      #C0272D;
    --closed-glow: rgba(192,39,45,.14);
    --time:        #2255E0;
    color-scheme:  light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #07090F;
      --surface:     #0D1220;
      --surface-2:   #121A30;
      --border:      #1A2540;
      --fg:          #D4E0FF;
      --fg-muted:    #4A6090;
      --accent:      #4A90FF;
      --accent-dim:  rgba(74,144,255,.14);
      --accent-glow: rgba(74,144,255,.24);
      --open:        #2FCD6E;
      --open-glow:   rgba(47,205,110,.20);
      --closed:      #FF5F5F;
      --closed-glow: rgba(255,95,95,.18);
      --time:        #7EB3FF;
      color-scheme:  dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:          #07090F;
    --surface:     #0D1220;
    --surface-2:   #121A30;
    --border:      #1A2540;
    --fg:          #D4E0FF;
    --fg-muted:    #4A6090;
    --accent:      #4A90FF;
    --accent-dim:  rgba(74,144,255,.14);
    --accent-glow: rgba(74,144,255,.24);
    --open:        #2FCD6E;
    --open-glow:   rgba(47,205,110,.20);
    --closed:      #FF5F5F;
    --closed-glow: rgba(255,95,95,.18);
    --time:        #7EB3FF;
    color-scheme:  dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-block: 48px;
    padding-left:  max(16px, env(safe-area-inset-left,  0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: relative;
    overflow-x: hidden;
  }

  /* Particle canvas */
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .55;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── GPU ticker ── */
  .ticker-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    height: 36px;
    display: flex;
    align-items: center;
    position: relative;
  }
  /* Scanline shimmer */
  .ticker-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--accent-dim) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: scanline 4s linear infinite;
    pointer-events: none;
  }
  @keyframes scanline {
    from { background-position: -200% 0; }
    to   { background-position: 200% 0; }
  }
  .ticker-label {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    padding: 0 12px;
    border-right: 1px solid var(--border);
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }
  .ticker-scroll-outer {
    flex: 1;
    overflow: hidden;
    height: 100%;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .ticker-scroll {
    display: flex;
    gap: 36px;
    white-space: nowrap;
    will-change: transform;
    animation: tickerMove 32s linear infinite;
    padding-left: 24px;
  }
  @keyframes tickerMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .tick-item {
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    display: flex;
    gap: 7px;
    align-items: baseline;
  }
  .tick-model { color: var(--fg); font-weight: 700; }
  .tick-spec  { color: var(--fg-muted); }
  .tick-mem   { color: var(--accent); }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 2px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .brand-name { font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
  .system-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .12em;
    color: var(--fg-muted);
    text-transform: uppercase;
  }

  /* ── Status card ── */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: box-shadow .5s, border-color .5s;
  }

  /* Animated gradient border glow when open */
  .status-card.is-open {
    border-color: var(--open);
    box-shadow:
      0 0 0 1px var(--open-glow),
      0 0 40px var(--open-glow),
      0 0 80px var(--accent-dim);
    animation: borderPulse 3s ease-in-out infinite;
  }
  @keyframes borderPulse {
    0%, 100% { box-shadow: 0 0 0 1px var(--open-glow), 0 0 30px var(--open-glow); }
    50%       { box-shadow: 0 0 0 1px var(--open-glow), 0 0 60px var(--open-glow), 0 0 100px var(--accent-dim); }
  }
  .status-card.is-closed {
    border-color: rgba(220,38,38,.3);
    box-shadow: 0 0 32px var(--closed-glow);
  }

  /* Corner accent lines */
  .status-card::before, .status-card::after {
    content: '';
    position: absolute;
    width: 32px; height: 32px;
    border-color: var(--accent);
    border-style: solid;
    opacity: .4;
    transition: opacity .4s;
  }
  .status-card::before { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .status-card::after  { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }
  .status-card.is-open::before,
  .status-card.is-open::after { opacity: 1; }

  /* Pulsing status dot */
  .status-dot-wrap {
    display: flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    border-radius: 50%;
    position: relative;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--open);
    opacity: 0;
  }
  .is-open .ring:nth-child(1) { animation: ringOut 2s ease-out infinite 0s; }
  .is-open .ring:nth-child(2) { animation: ringOut 2s ease-out infinite .6s; }
  .is-open .ring:nth-child(3) { animation: ringOut 2s ease-out infinite 1.2s; }
  @keyframes ringOut {
    0%   { transform: scale(1);   opacity: .6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .is-closed .ring { display: none; }
  .status-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    position: relative;
    z-index: 1;
  }
  .is-open  .status-dot { background: var(--open);   box-shadow: 0 0 12px var(--open), 0 0 24px var(--open-glow); }
  .is-closed .status-dot { background: var(--closed); box-shadow: 0 0 10px var(--closed); }

  /* Pill */
  .status-pill {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 700;
  }
  .is-open  .status-pill { color: var(--open);   background: var(--open-glow);   border: 1px solid var(--open);   }
  .is-closed .status-pill { color: var(--closed); background: var(--closed-glow); border: 1px solid var(--closed); }

  .status-heading {
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: -.03em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .status-sub {
    color: var(--fg-muted);
    font-size: .88rem;
    line-height: 1.55;
    max-width: 34ch;
    text-wrap: balance;
  }

  /* Clock */
  .clock-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .live-clock {
    font-family: 'Space Mono', monospace;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--time);
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px var(--accent-glow);
  }
  .clock-tz {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .14em;
    color: var(--fg-muted);
    text-transform: uppercase;
  }

  /* Countdown */
  .countdown-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 180px;
  }
  .countdown-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--fg-muted);
  }
  .countdown-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.65rem; font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: .06em;
    text-shadow: 0 0 16px var(--accent-glow);
  }

  /* CTA */
  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700; font-size: .9rem;
    padding: 13px 28px;
    border-radius: 10px;
    letter-spacing: .01em;
    box-shadow: 0 0 24px var(--accent-glow);
    transition: opacity .15s, transform .15s, box-shadow .15s;
  }
  .cta-btn:hover {
    opacity: .9;
    transform: translateY(-2px);
    box-shadow: 0 4px 32px var(--accent-glow);
  }
  .cta-arrow { display: inline-block; transition: transform .2s; }
  .cta-btn:hover .cta-arrow { transform: translateX(3px); }

  /* Sparkline */
  .mini-chart { width: 100%; height: 48px; overflow: visible; }

  /* ── Hours card ── */
  .hours-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .hours-title {
    font-family: 'Space Mono', monospace;
    font-size: .6rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--fg-muted);
    margin-bottom: 14px;
  }
  .hours-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .day-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .day-label {
    font-family: 'Space Mono', monospace;
    font-size: .57rem; letter-spacing: .06em;
    text-transform: uppercase; color: var(--fg-muted);
  }
  .day-bar { width: 100%; height: 44px; border-radius: 5px; background: var(--surface-2); }
  .day-col.active .day-bar { background: var(--accent-dim); border: 1px solid rgba(5,150,105,.25); }
  .day-col.today .day-label { color: var(--accent); font-weight: 700; }
  .day-col.today .day-bar   { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-dim); }
  .day-hours {
    font-family: 'Space Mono', monospace;
    font-size: .57rem; color: var(--fg-muted);
    text-align: center; line-height: 1.4;
  }
  .day-col.active .day-hours { color: var(--accent); }
  .day-col.off .day-hours    { opacity: .4; }

  /* ── Footer ── */
  .footer { text-align: center; color: var(--fg-muted); font-size: .78rem; line-height: 1.65; }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .ticker-scroll, .ticker-wrap::after, .ring,
    .status-card, .cta-btn, .live-clock, .countdown-value { animation: none !important; transition: none !important; }
  }
</style>

<script>
  /* ── Particle network background ── */
  (function () {
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');
    let W, H, pts;
    const COUNT = 42, MAX_DIST = 120;

    function getColor() {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      return dark ? '74,144,255' : '34,85,224';
    }

    function resize() {
      W = cvs.width  = window.innerWidth;
      H = cvs.height = window.innerHeight;
    }

    function init() {
      pts = Array.from({ length: COUNT }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4,
        r: Math.random() * 1.5 + 1
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const c = getColor();
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      });
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < MAX_DIST) {
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[j].x, pts[j].y);
            ctx.strokeStyle = `rgba(${c},${(1 - d / MAX_DIST) * .3})`;
            ctx.lineWidth = .8;
            ctx.stroke();
          }
        }
        ctx.beginPath();
        ctx.arc(pts[i].x, pts[i].y, pts[i].r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${c},.55)`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    resize();
    init();
    draw();
    window.addEventListener('resize', () => { resize(); init(); });
  })();

  /* ── GPU Ticker ── */
  const GPUS = [
    { model: 'H100', spec: 'SXM5 · 80GB', mem: 'HBM3' },
    { model: 'A100', spec: '40GB',         mem: 'HBM2e' },
    { model: 'RTX 4090', spec: '24GB',     mem: 'GDDR6X' },
    { model: 'MI300X', spec: '192GB',      mem: 'HBM3' },
    { model: 'L40S',  spec: '48GB',        mem: 'GDDR6' },
    { model: 'RTX 3090', spec: '24GB',     mem: 'GDDR6X' },
    { model: 'A6000', spec: '48GB',        mem: 'GDDR6' },
    { model: 'Gaudi 3', spec: '128GB',     mem: 'HBM2e' },
  ];

  (function buildTicker() {
    const scroll = document.getElementById('tickerScroll');
    scroll.innerHTML = [...GPUS, ...GPUS].map(g =>
      `<span class="tick-item">
        <span class="tick-model">${g.model}</span>
        <span class="tick-spec">${g.spec}</span>
        <span class="tick-mem">${g.mem}</span>
       </span>`
    ).join('');
  })();

  /* ── Sparkline ── */
  function buildSparkline(open) {
    const svg = document.getElementById('miniChart');
    const pts = 28;
    let s = [...new Date().toDateString()].reduce((a,c) => a + c.charCodeAt(0), 0);
    const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
    const vals = Array.from({ length: pts }, rand);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const ys = vals.map(v => 38 - ((v - mn) / (mx - mn)) * 28);
    const xs = vals.map((_, i) => (i / (pts - 1)) * 400);
    const path = xs.map((x, i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const color = open ? 'var(--open)' : 'var(--fg-muted)';
    svg.innerHTML = `
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity=".35"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${path} L400,48 L0,48 Z" fill="url(#sg)"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  /* ── Time logic ── */
  const OPEN_HOUR = 7, CLOSE_HOUR = 18, TZ = 'America/Chicago';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function chicagoDate() {
    const p = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hour12: false,
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit', weekday:'short'
    }).formatToParts(new Date()).forEach(({type,value}) => p[type] = value);
    return {
      year:parseInt(p.year), month:parseInt(p.month)-1, day:parseInt(p.day),
      hour:parseInt(p.hour)===24?0:parseInt(p.hour),
      minute:parseInt(p.minute), second:parseInt(p.second),
      dowIndex:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoDateOf(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone:TZ, hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'
    }).formatToParts(d).forEach(({type,value}) => p[type]=value);
    return {
      year:parseInt(p.year), month:parseInt(p.month)-1, day:parseInt(p.day),
      hour:parseInt(p.hour)===24?0:parseInt(p.hour),
      minute:parseInt(p.minute), second:parseInt(p.second),
      dowIndex:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoMidnight(d) {
    const tc = chicagoDateOf(d);
    const offsetStr = new Intl.DateTimeFormat('en-US',{timeZone:TZ,timeZoneName:'shortOffset'})
      .formatToParts(d).find(p=>p.type==='timeZoneName').value;
    const m = offsetStr.match(/GMT([+-])(\d+)(?::(\d+))?/);
    if (!m) return NaN;
    const iso = `${tc.year}-${String(tc.month+1).padStart(2,'0')}-${String(tc.day).padStart(2,'0')}T00:00:00${m[1]}${String(m[2]).padStart(2,'0')}:${String(m[3]||'0').padStart(2,'0')}`;
    return new Date(iso).getTime();
  }

  function isBizDay(d) { return d >= 1 && d <= 5; }
  function isOpen(c)   { return isBizDay(c.dowIndex) && c.hour >= OPEN_HOUR && c.hour < CLOSE_HOUR; }

  function msUntilOpen() {
    const now = new Date();
    for (let d = 0; d <= 6; d++) {
      const trial = new Date(now.getTime() + d * 86400000);
      const tc = chicagoDateOf(trial);
      if (!isBizDay(tc.dowIndex)) continue;
      const openMs = chicagoMidnight(trial) + OPEN_HOUR * 3600000;
      if (openMs > now.getTime()) return openMs - now.getTime();
    }
    return null;
  }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
      .map(n => String(n).padStart(2,'0')).join(':');
  }

  /* ── Hours grid ── */
  (function buildGrid() {
    const todayDow = chicagoDate().dowIndex;
    const grid = document.getElementById('hoursGrid');
    DAYS.forEach((day, i) => {
      const active = i >= 1 && i <= 5, today = i === todayDow;
      const col = document.createElement('div');
      col.className = 'day-col' + (active ? ' active' : ' off') + (today ? ' today' : '');
      col.innerHTML = `<div class="day-label">${day}</div><div class="day-bar"></div><div class="day-hours">${active ? '7a–6p' : '—'}</div>`;
      grid.appendChild(col);
    });
  })();

  /* ── Tick ── */
  let sparkBuilt = false;

  function tick() {
    const c = chicagoDate();
    const h12 = c.hour % 12 || 12;
    const ampm = c.hour < 12 ? 'AM' : 'PM';
    document.getElementById('liveClock').textContent =
      `${String(h12).padStart(2,'0')}:${String(c.minute).padStart(2,'0')}:${String(c.second).padStart(2,'0')} ${ampm}`;

    const open = isOpen(c);
    if (!sparkBuilt) { buildSparkline(open); sparkBuilt = true; }

    const card    = document.getElementById('statusCard');
    const pill    = document.getElementById('statusPill');
    const heading = document.getElementById('statusHeading');
    const sub     = document.getElementById('statusSub');
    const ctaBtn  = document.getElementById('ctaBtn');
    const cdBlock = document.getElementById('countdownBlock');
    const cdValue = document.getElementById('countdownValue');

    if (open) {
      card.className = 'status-card is-open';
      pill.textContent = 'Store Online';
      heading.textContent = 'Store is live';
      sub.textContent = 'We\'re online and taking orders today until 6:00 PM CST.';
      ctaBtn.hidden = false;
      cdBlock.hidden = true;
    } else {
      card.className = 'status-card is-closed';
      pill.textContent = 'Store Offline';
      heading.textContent = 'Closed for now';
      sub.textContent = 'The store runs on a scheduled window to keep costs low — weekdays 7 AM to 6 PM CST.';
      ctaBtn.hidden = true;
      cdBlock.hidden = false;
      const ms = msUntilOpen();
      cdValue.textContent = ms ? fmt(ms) : '--:--:--';
    }
  }

  tick();
  setInterval(tick, 1000);
</script>
