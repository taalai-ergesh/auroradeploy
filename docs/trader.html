<meta charset="utf-8">
<title>Paper Trader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">

<style>
  :root {
    --bg:          #F0F4F8;
    --surface:     #FFFFFF;
    --surface-2:   #E8F5EE;
    --border:      #D1E4D9;
    --fg:          #0A1A10;
    --fg-muted:    #4A6B58;
    --accent:      #0A8044;
    --accent-dim:  rgba(10,128,68,.12);
    --open:        #0A8044;
    --open-glow:   rgba(10,128,68,.15);
    --closed:      #C0272D;
    --closed-glow: rgba(192,39,45,.12);
    --time:        #1446A0;
    --tick-up:     #0A8044;
    --tick-dn:     #C0272D;
    color-scheme:  light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #090E14;
      --surface:     #111820;
      --surface-2:   #162130;
      --border:      #1E2D3D;
      --fg:          #D6E8F4;
      --fg-muted:    #4D6880;
      --accent:      #00C853;
      --accent-dim:  rgba(0,200,83,.14);
      --open:        #00C853;
      --open-glow:   rgba(0,200,83,.18);
      --closed:      #FF4D4D;
      --closed-glow: rgba(255,77,77,.18);
      --time:        #60A5FA;
      --tick-up:     #00C853;
      --tick-dn:     #FF4D4D;
      color-scheme:  dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:          #090E14;
    --surface:     #111820;
    --surface-2:   #162130;
    --border:      #1E2D3D;
    --fg:          #D6E8F4;
    --fg-muted:    #4D6880;
    --accent:      #00C853;
    --accent-dim:  rgba(0,200,83,.14);
    --open:        #00C853;
    --open-glow:   rgba(0,200,83,.18);
    --closed:      #FF4D4D;
    --closed-glow: rgba(255,77,77,.18);
    --time:        #60A5FA;
    --tick-up:     #00C853;
    --tick-dn:     #FF4D4D;
    color-scheme:  dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-block: 48px;
    padding-left:  max(16px, env(safe-area-inset-left,  0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Faint grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: .4;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Ticker tape ── */
  .ticker-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    height: 36px;
    display: flex;
    align-items: center;
  }
  .ticker-label {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .12em;
    color: var(--fg-muted);
    text-transform: uppercase;
    padding: 0 12px;
    border-right: 1px solid var(--border);
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .ticker-scroll-outer {
    flex: 1;
    overflow: hidden;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .ticker-scroll {
    display: flex;
    gap: 32px;
    white-space: nowrap;
    will-change: transform;
    animation: tickerMove 28s linear infinite;
    padding-left: 24px;
  }
  @keyframes tickerMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .tick-item {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    display: flex;
    gap: 6px;
    align-items: baseline;
  }
  .tick-sym { color: var(--fg); font-weight: 700; }
  .tick-price { color: var(--fg-muted); }
  .tick-chg.up   { color: var(--tick-up); }
  .tick-chg.down { color: var(--tick-dn); }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 2px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  .brand-name {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -.01em;
  }
  .system-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .12em;
    color: var(--fg-muted);
    text-transform: uppercase;
  }

  /* ── Status card ── */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
    transition: box-shadow .4s, border-color .4s;
  }
  .status-card.is-open {
    border-color: rgba(0,200,83,.35);
    box-shadow: 0 0 48px var(--open-glow);
  }
  .status-card.is-closed {
    border-color: rgba(192,39,45,.25);
    box-shadow: 0 0 32px var(--closed-glow);
  }

  /* Pulsing status dot */
  .status-dot-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px; height: 60px;
    border-radius: 50%;
    position: relative;
  }
  .status-dot-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    opacity: 0;
  }
  .is-open .status-dot-wrap::before {
    background: var(--open-glow);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0;   transform: scale(1);   }
    50%       { opacity: 1;   transform: scale(1.6); }
  }
  .status-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    position: relative;
    z-index: 1;
  }
  .is-open  .status-dot { background: var(--open);   box-shadow: 0 0 10px var(--open);   }
  .is-closed .status-dot { background: var(--closed); box-shadow: 0 0 10px var(--closed); }

  /* Pill */
  .market-pill {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 700;
  }
  .is-open  .market-pill { color: var(--open);   background: var(--open-glow);   }
  .is-closed .market-pill { color: var(--closed); background: var(--closed-glow); }

  .status-heading {
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: -.03em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .status-sub {
    color: var(--fg-muted);
    font-size: .88rem;
    line-height: 1.55;
    max-width: 34ch;
    text-wrap: balance;
  }

  /* Clock */
  .clock-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .live-clock {
    font-family: 'Space Mono', monospace;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--time);
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  .clock-tz {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .14em;
    color: var(--fg-muted);
    text-transform: uppercase;
  }

  /* Countdown */
  .countdown-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 180px;
  }
  .countdown-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .countdown-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: .06em;
  }

  /* CTA */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: .9rem;
    padding: 12px 26px;
    border-radius: 10px;
    letter-spacing: .01em;
    transition: opacity .15s, transform .15s;
  }
  .cta-btn:hover { opacity: .88; transform: translateY(-1px); }

  /* ── Mini chart (decorative) ── */
  .mini-chart {
    width: 100%;
    height: 48px;
    overflow: visible;
  }

  /* ── Hours card ── */
  .hours-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .hours-title {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 14px;
  }
  .hours-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .day-label {
    font-family: 'Space Mono', monospace;
    font-size: .57rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .day-bar {
    width: 100%;
    height: 44px;
    border-radius: 5px;
    background: var(--surface-2);
    position: relative;
    overflow: hidden;
  }
  .day-col.active .day-bar {
    background: var(--accent-dim);
    border: 1px solid rgba(0,200,83,.2);
  }
  .day-col.today .day-label { color: var(--accent); font-weight: 700; }
  .day-col.today .day-bar {
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-dim);
  }
  .day-hours {
    font-family: 'Space Mono', monospace;
    font-size: .57rem;
    color: var(--fg-muted);
    text-align: center;
    line-height: 1.4;
  }
  .day-col.active .day-hours { color: var(--accent); }
  .day-col.off .day-hours    { opacity: .4; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    color: var(--fg-muted);
    font-size: .78rem;
    line-height: 1.65;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .ticker-scroll, .status-dot-wrap::before, .cta-btn { animation: none; transition: none; }
  }
</style>

<div class="wrap">

  <!-- Ticker tape -->
  <div class="ticker-wrap">
    <div class="ticker-label">Sim&nbsp;Quotes</div>
    <div class="ticker-scroll-outer">
      <div class="ticker-scroll" id="tickerScroll">
        <!-- JS fills this with doubled items for seamless loop -->
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">📈</div>
      <div class="brand-name">Paper Trader</div>
    </div>
    <div class="system-label">Market Status</div>
  </div>

  <!-- Status card -->
  <div class="status-card" id="statusCard">
    <div class="status-dot-wrap">
      <div class="status-dot" id="statusDot"></div>
    </div>

    <div class="market-pill" id="marketPill"></div>

    <div class="clock-block">
      <div class="live-clock" id="liveClock">--:--:--</div>
      <div class="clock-tz">Chicago / CST</div>
    </div>

    <div class="status-heading" id="statusHeading"></div>
    <div class="status-sub" id="statusSub"></div>

    <!-- decorative sparkline -->
    <svg class="mini-chart" id="miniChart" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true"></svg>

    <div class="countdown-block" id="countdownBlock" hidden>
      <div class="countdown-label">Market Opens In</div>
      <div class="countdown-value" id="countdownValue">--:--:--</div>
    </div>

    <a class="cta-btn" id="ctaBtn" href="https://trader.auroradeploy.com" target="_blank" rel="noopener" hidden>
      Open Trading Console →
    </a>
  </div>

  <!-- Hours grid -->
  <div class="hours-card">
    <div class="hours-title">Trading Hours — Mon–Fri · 7 am – 6 pm CST</div>
    <div class="hours-grid" id="hoursGrid"></div>
  </div>

  <div class="footer">
    Live site: <a href="https://trader.auroradeploy.com" target="_blank" rel="noopener">trader.auroradeploy.com</a><br>
    Available weekdays 7 am – 6 pm Central Time<br><br>
    Also by Taalai &mdash;
    <a href="https://aistore.auroradeploy.com" target="_blank" rel="noopener">AI Hardware Store</a>
    &middot; GPU hardware for AI builds
  </div>

</div>

<script>
  const OPEN_HOUR  = 7;
  const CLOSE_HOUR = 18;
  const TZ   = 'America/Chicago';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Fake tickers for the tape (simulated, decorative)
  const TICKERS = [
    { sym: 'NVDA', price: '134.52', chg: '+2.14%', up: true },
    { sym: 'AAPL', price: '228.87', chg: '-0.43%', up: false },
    { sym: 'MSFT', price: '415.20', chg: '+0.91%', up: true },
    { sym: 'TSLA', price: '247.08', chg: '+3.56%', up: true },
    { sym: 'AMZN', price: '210.44', chg: '-1.02%', up: false },
    { sym: 'GOOG', price: '191.66', chg: '+0.37%', up: true },
    { sym: 'META', price: '589.12', chg: '-0.78%', up: false },
    { sym: 'AMD',  price: '155.33', chg: '+1.88%', up: true },
  ];

  function buildTicker() {
    const scroll = document.getElementById('tickerScroll');
    // Double the items so we can loop seamlessly
    const items = [...TICKERS, ...TICKERS].map(t => `
      <span class="tick-item">
        <span class="tick-sym">${t.sym}</span>
        <span class="tick-price">${t.price}</span>
        <span class="tick-chg ${t.up ? 'up' : 'down'}">${t.chg}</span>
      </span>
    `).join('');
    scroll.innerHTML = items;
  }

  // Decorative sparkline — random but deterministic per day
  function buildSparkline(isOpen) {
    const svg = document.getElementById('miniChart');
    const pts = 24;
    const seed = new Date().toDateString();
    // Simple seeded pseudo-random
    let s = [...seed].reduce((a,c) => a + c.charCodeAt(0), 0);
    function rand() { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; }
    const vals = Array.from({length: pts}, () => rand());
    // Normalize 10..38
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const ys = vals.map(v => 38 - ((v - mn) / (mx - mn)) * 28);
    const xs = vals.map((_, i) => (i / (pts - 1)) * 400);
    const path = xs.map((x, i) => `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    // Fill under curve
    const fill = path + ` L400,48 L0,48 Z`;
    const color = isOpen ? 'var(--open)' : 'var(--fg-muted)';
    const opacity = isOpen ? '0.15' : '0.08';
    svg.innerHTML = `
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${fill}" fill="url(#sg)"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  function chicagoDate() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      weekday: 'short'
    }).formatToParts(now);
    const p = {};
    parts.forEach(({ type, value }) => p[type] = value);
    return {
      year: parseInt(p.year), month: parseInt(p.month) - 1, day: parseInt(p.day),
      hour: parseInt(p.hour) === 24 ? 0 : parseInt(p.hour),
      minute: parseInt(p.minute), second: parseInt(p.second),
      weekday: p.weekday,
      dowIndex: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoDateOf(d) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      weekday: 'short'
    }).formatToParts(d);
    const p = {};
    parts.forEach(({ type, value }) => p[type] = value);
    return {
      year: parseInt(p.year), month: parseInt(p.month) - 1, day: parseInt(p.day),
      hour: parseInt(p.hour) === 24 ? 0 : parseInt(p.hour),
      minute: parseInt(p.minute), second: parseInt(p.second),
      weekday: p.weekday,
      dowIndex: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoMidnight(d) {
    const tc = chicagoDateOf(d);
    const offsetStr = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, timeZoneName: 'shortOffset'
    }).formatToParts(d).find(p => p.type === 'timeZoneName').value;
    const match = offsetStr.match(/GMT([+-])(\d+)(?::(\d+))?/);
    if (!match) return NaN;
    const sign = match[1];
    const hrs  = String(match[2]).padStart(2, '0');
    const mins = String(match[3] || '0').padStart(2, '0');
    const iso = `${tc.year}-${String(tc.month+1).padStart(2,'0')}-${String(tc.day).padStart(2,'0')}T00:00:00${sign}${hrs}:${mins}`;
    return new Date(iso).getTime();
  }

  function isBusinessDay(dow) { return dow >= 1 && dow <= 5; }
  function isOpen(c) { return isBusinessDay(c.dowIndex) && c.hour >= OPEN_HOUR && c.hour < CLOSE_HOUR; }

  function msUntilOpen(c) {
    const now = new Date();
    for (let d = 0; d <= 6; d++) {
      const trial = new Date(now.getTime() + d * 86400000);
      const tc = chicagoDateOf(trial);
      if (!isBusinessDay(tc.dowIndex)) continue;
      const openMs = chicagoMidnight(trial) + OPEN_HOUR * 3600000;
      if (openMs > now.getTime()) return openMs - now.getTime();
    }
    return null;
  }

  function formatCountdown(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function buildHoursGrid(todayDow) {
    const grid = document.getElementById('hoursGrid');
    DAYS.forEach((day, i) => {
      const active = i >= 1 && i <= 5;
      const today  = i === todayDow;
      const col = document.createElement('div');
      col.className = 'day-col' + (active ? ' active' : ' off') + (today ? ' today' : '');
      col.innerHTML = `
        <div class="day-label">${day}</div>
        <div class="day-bar"></div>
        <div class="day-hours">${active ? '7a–6p' : '—'}</div>
      `;
      grid.appendChild(col);
    });
  }

  let sparkBuilt = false;

  function tick() {
    const c = chicagoDate();
    const h12 = c.hour % 12 === 0 ? 12 : c.hour % 12;
    const ampm = c.hour < 12 ? 'AM' : 'PM';
    document.getElementById('liveClock').textContent =
      `${String(h12).padStart(2,'0')}:${String(c.minute).padStart(2,'0')}:${String(c.second).padStart(2,'0')} ${ampm}`;

    const open = isOpen(c);

    if (!sparkBuilt) { buildSparkline(open); sparkBuilt = true; }

    const card    = document.getElementById('statusCard');
    const pill    = document.getElementById('marketPill');
    const heading = document.getElementById('statusHeading');
    const sub     = document.getElementById('statusSub');
    const ctaBtn  = document.getElementById('ctaBtn');
    const cdBlock = document.getElementById('countdownBlock');
    const cdValue = document.getElementById('countdownValue');

    if (open) {
      card.className = 'status-card is-open';
      pill.textContent = 'Market Open';
      heading.textContent = 'Trading is live';
      sub.textContent = 'The paper trading console is running. Place simulated trades and track your portfolio.';
      ctaBtn.hidden = false;
      cdBlock.hidden = true;
    } else {
      card.className = 'status-card is-closed';
      pill.textContent = 'Market Closed';
      heading.textContent = 'Markets are closed';
      sub.textContent = 'The server runs on a scheduled window to keep costs low — weekdays 7 AM to 6 PM CST.';
      ctaBtn.hidden = true;
      cdBlock.hidden = false;
      const ms = msUntilOpen(c);
      cdValue.textContent = ms ? formatCountdown(ms) : '--:--:--';
    }
  }

  buildTicker();
  buildHoursGrid(chicagoDate().dowIndex);
  tick();
  setInterval(tick, 1000);
</script>
