<meta charset="utf-8">
<title>Paper Trader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">

<style>
  :root {
    --bg:          #F0FDF7;
    --surface:     #FFFFFF;
    --surface-2:   #E0FAF0;
    --border:      #A7F3D0;
    --fg:          #064E3B;
    --fg-muted:    #34786A;
    --accent:      #059669;
    --accent-dim:  rgba(5,150,105,.13);
    --accent-glow: rgba(5,150,105,.22);
    --open:        #059669;
    --open-glow:   rgba(5,150,105,.18);
    --closed:      #DC2626;
    --closed-glow: rgba(220,38,38,.14);
    --time:        #047857;
    --tick-up:     #059669;
    --tick-dn:     #DC2626;
    color-scheme:  light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #020D08;
      --surface:     #061410;
      --surface-2:   #091E18;
      --border:      #0D2E22;
      --fg:          #B4F5D8;
      --fg-muted:    #2D6B52;
      --accent:      #10B981;
      --accent-dim:  rgba(16,185,129,.13);
      --accent-glow: rgba(16,185,129,.24);
      --open:        #10B981;
      --open-glow:   rgba(16,185,129,.22);
      --closed:      #F87171;
      --closed-glow: rgba(248,113,113,.18);
      --time:        #34D399;
      --tick-up:     #10B981;
      --tick-dn:     #F87171;
      color-scheme:  dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:          #020D08;
    --surface:     #061410;
    --surface-2:   #091E18;
    --border:      #0D2E22;
    --fg:          #B4F5D8;
    --fg-muted:    #2D6B52;
    --accent:      #10B981;
    --accent-dim:  rgba(16,185,129,.13);
    --accent-glow: rgba(16,185,129,.24);
    --open:        #10B981;
    --open-glow:   rgba(16,185,129,.22);
    --closed:      #F87171;
    --closed-glow: rgba(248,113,113,.18);
    --time:        #34D399;
    --tick-up:     #10B981;
    --tick-dn:     #F87171;
    color-scheme:  dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-block: 48px;
    padding-left:  max(16px, env(safe-area-inset-left,  0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: relative;
    overflow-x: hidden;
  }

  /* Animated candlestick chart canvas */
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .45;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Ticker tape ── */
  .ticker-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    height: 36px;
    display: flex;
    align-items: center;
  }
  .ticker-label {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    padding: 0 12px;
    border-right: 1px solid var(--border);
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .ticker-scroll-outer {
    flex: 1;
    overflow: hidden;
    height: 100%;
    display: flex;
    align-items: center;
    /* Fade edges */
    -webkit-mask-image: linear-gradient(90deg, transparent, black 12px, black calc(100% - 12px), transparent);
    mask-image: linear-gradient(90deg, transparent, black 12px, black calc(100% - 12px), transparent);
  }
  .ticker-scroll {
    display: flex;
    gap: 32px;
    white-space: nowrap;
    will-change: transform;
    animation: tickerMove 28s linear infinite;
    padding-left: 24px;
  }
  @keyframes tickerMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .tick-item {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    display: flex;
    gap: 6px;
    align-items: baseline;
  }
  .tick-sym   { color: var(--fg); font-weight: 700; }
  .tick-price { color: var(--fg-muted); }
  .tick-chg.up   { color: var(--tick-up); }
  .tick-chg.down { color: var(--tick-dn); }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 2px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .brand-name { font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
  .system-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem; letter-spacing: .12em;
    color: var(--fg-muted); text-transform: uppercase;
  }

  /* ── Status card ── */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; text-align: center;
    position: relative; overflow: hidden;
    transition: box-shadow .5s, border-color .5s;
  }
  /* Animated gradient sweep when open */
  .status-card.is-open::before {
    content: '';
    position: absolute;
    inset: 0;
    background: conic-gradient(
      from var(--angle, 0deg) at 50% 50%,
      transparent 0deg,
      var(--accent-dim) 60deg,
      transparent 120deg
    );
    animation: rotateBg 6s linear infinite;
    pointer-events: none;
  }
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes rotateBg { to { --angle: 360deg; } }

  .status-card.is-open {
    border-color: var(--open);
    box-shadow: 0 0 48px var(--open-glow), 0 0 100px var(--accent-dim);
  }
  .status-card.is-closed {
    border-color: rgba(220,38,38,.3);
    box-shadow: 0 0 32px var(--closed-glow);
  }

  /* Content sits above the gradient */
  .status-card > * { position: relative; z-index: 1; }

  /* Pulsing status dot */
  .status-dot-wrap {
    display: flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 50%; position: relative;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid var(--open); opacity: 0;
  }
  .is-open .ring:nth-child(1) { animation: ringOut 2.4s ease-out infinite 0s; }
  .is-open .ring:nth-child(2) { animation: ringOut 2.4s ease-out infinite .8s; }
  .is-open .ring:nth-child(3) { animation: ringOut 2.4s ease-out infinite 1.6s; }
  @keyframes ringOut {
    0%   { transform: scale(1);   opacity: .7; }
    100% { transform: scale(2.4); opacity: 0;  }
  }
  .is-closed .ring { display: none; }
  .status-dot {
    width: 24px; height: 24px; border-radius: 50%; position: relative; z-index: 1;
  }
  .is-open  .status-dot { background: var(--open);   box-shadow: 0 0 14px var(--open), 0 0 28px var(--open-glow); }
  .is-closed .status-dot { background: var(--closed); box-shadow: 0 0 10px var(--closed); }

  /* Pill */
  .market-pill {
    font-family: 'Space Mono', monospace;
    font-size: .65rem; letter-spacing: .14em;
    text-transform: uppercase; padding: 4px 14px;
    border-radius: 999px; font-weight: 700;
  }
  .is-open  .market-pill { color: var(--open);   background: var(--open-glow);   border: 1px solid var(--open);   }
  .is-closed .market-pill { color: var(--closed); background: var(--closed-glow); border: 1px solid var(--closed); }

  .status-heading {
    font-weight: 700; font-size: 1.75rem;
    letter-spacing: -.03em; line-height: 1.15; text-wrap: balance;
  }
  .status-sub {
    color: var(--fg-muted); font-size: .88rem;
    line-height: 1.55; max-width: 34ch; text-wrap: balance;
  }

  /* Clock */
  .clock-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .live-clock {
    font-family: 'Space Mono', monospace;
    font-size: 2.2rem; font-weight: 700;
    color: var(--time); letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px var(--accent-glow);
  }
  .clock-tz {
    font-family: 'Space Mono', monospace;
    font-size: .6rem; letter-spacing: .14em;
    color: var(--fg-muted); text-transform: uppercase;
  }

  /* Countdown */
  .countdown-block {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 180px;
  }
  .countdown-label {
    font-family: 'Space Mono', monospace;
    font-size: .6rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--fg-muted);
  }
  .countdown-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.65rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums;
    letter-spacing: .06em;
    text-shadow: 0 0 16px var(--accent-glow);
  }

  /* CTA */
  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff;
    text-decoration: none; font-weight: 700; font-size: .9rem;
    padding: 13px 28px; border-radius: 10px; letter-spacing: .01em;
    box-shadow: 0 0 24px var(--accent-glow);
    transition: opacity .15s, transform .15s, box-shadow .15s;
  }
  .cta-btn:hover { opacity: .9; transform: translateY(-2px); box-shadow: 0 4px 32px var(--accent-glow); }
  .cta-arrow { display: inline-block; transition: transform .2s; }
  .cta-btn:hover .cta-arrow { transform: translateX(3px); }

  /* Sparkline */
  .mini-chart { width: 100%; height: 48px; overflow: visible; }

  /* ── Hours card ── */
  .hours-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px;
  }
  .hours-title {
    font-family: 'Space Mono', monospace;
    font-size: .6rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--fg-muted); margin-bottom: 14px;
  }
  .hours-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .day-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .day-label {
    font-family: 'Space Mono', monospace;
    font-size: .57rem; letter-spacing: .06em;
    text-transform: uppercase; color: var(--fg-muted);
  }
  .day-bar { width: 100%; height: 44px; border-radius: 5px; background: var(--surface-2); }
  .day-col.active .day-bar { background: var(--accent-dim); border: 1px solid rgba(16,185,129,.22); }
  .day-col.today .day-label { color: var(--accent); font-weight: 700; }
  .day-col.today .day-bar   { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-dim); }
  .day-hours {
    font-family: 'Space Mono', monospace;
    font-size: .57rem; color: var(--fg-muted); text-align: center; line-height: 1.4;
  }
  .day-col.active .day-hours { color: var(--accent); }
  .day-col.off .day-hours    { opacity: .4; }

  /* ── Footer ── */
  .footer { text-align: center; color: var(--fg-muted); font-size: .78rem; line-height: 1.65; }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .ticker-scroll, .ring, .status-card::before,
    .cta-btn, .live-clock, .countdown-value { animation: none !important; transition: none !important; }
  }
</style>

<canvas id="canvas"></canvas>

<div class="wrap">

  <div class="ticker-wrap">
    <div class="ticker-label">Sim&nbsp;Quotes</div>
    <div class="ticker-scroll-outer">
      <div class="ticker-scroll" id="tickerScroll"></div>
    </div>
  </div>

  <div class="header">
    <div class="brand">
      <div class="brand-icon">📈</div>
      <div class="brand-name">Paper Trader</div>
    </div>
    <div class="system-label">Market Status</div>
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-dot-wrap">
      <div class="ring"></div>
      <div class="ring"></div>

    <div class="market-pill" id="marketPill"></div>

    <div class="clock-block">

    <div class="status-heading" id="statusHeading"></div>

<script>
  /* ── Animated candlestick background ── */
  (function () {
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');
    let W, H, candles, offset = 0;
    const CANDLE_W = 18, GAP = 8, STEP = CANDLE_W + GAP;

    function getColor() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches
        ? { up: '16,185,129', dn: '248,113,113' }
        : { up: '5,150,105',  dn: '220,38,38'  };
    }

    function resize() {
      W = cvs.width  = window.innerWidth;
      H = cvs.height = window.innerHeight;
      buildCandles();
    }

    function buildCandles() {
      const count = Math.ceil(W / STEP) + 4;
      // Simple random walk for price
      let price = H * 0.5;
      candles = Array.from({ length: count * 2 }, () => {
        const open  = price;
        const move  = (Math.random() - 0.48) * H * 0.07;
        const close = Math.max(H * 0.1, Math.min(H * 0.9, price + move));
        const high  = Math.min(H * 0.9, Math.max(open, close) + Math.random() * H * 0.03);
        const low   = Math.max(H * 0.1, Math.min(open, close) - Math.random() * H * 0.03);
        price = close;
        return { open, close, high, low };
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const c = getColor();
      offset = (offset + 0.4) % STEP;

      candles.forEach((cd, i) => {
        const x = i * STEP - offset;
        if (x < -STEP || x > W + STEP) return;
        const up = cd.close >= cd.open;
        const col = up ? c.up : c.dn;
        const top = Math.min(cd.open, cd.close);
        const bot = Math.max(cd.open, cd.close);
        const bodyH = Math.max(2, bot - top);

        // Wick
        ctx.beginPath();
        ctx.moveTo(x + CANDLE_W / 2, cd.high);
        ctx.lineTo(x + CANDLE_W / 2, cd.low);
        ctx.strokeStyle = `rgba(${col},.35)`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Body
        ctx.fillStyle = `rgba(${col},.22)`;
        ctx.fillRect(x, top, CANDLE_W, bodyH);
        ctx.strokeStyle = `rgba(${col},.5)`;
        ctx.lineWidth = 1;
        ctx.strokeRect(x, top, CANDLE_W, bodyH);
      });

      requestAnimationFrame(draw);
    }

    resize();
    draw();
    window.addEventListener('resize', resize);
  })();

  /* ── Ticker tape ── */
  const TICKERS = [
    { sym: 'NVDA', price: '134.52', chg: '+2.14%', up: true },
    { sym: 'AAPL', price: '228.87', chg: '-0.43%', up: false },
    { sym: 'MSFT', price: '415.20', chg: '+0.91%', up: true },
    { sym: 'TSLA', price: '247.08', chg: '+3.56%', up: true },
    { sym: 'AMZN', price: '210.44', chg: '-1.02%', up: false },
    { sym: 'GOOG', price: '191.66', chg: '+0.37%', up: true },
    { sym: 'META', price: '589.12', chg: '-0.78%', up: false },
    { sym: 'AMD',  price: '155.33', chg: '+1.88%', up: true },
  ];

  document.getElementById('tickerScroll').innerHTML =
    [...TICKERS, ...TICKERS].map(t =>
      `<span class="tick-item">
        <span class="tick-sym">${t.sym}</span>
        <span class="tick-price">${t.price}</span>
        <span class="tick-chg ${t.up ? 'up' : 'down'}">${t.chg}</span>
       </span>`
    ).join('');

  /* ── Sparkline ── */
  function buildSparkline(open) {
    const svg = document.getElementById('miniChart');
    const pts = 28;
    let s = [...new Date().toDateString()].reduce((a, c) => a + c.charCodeAt(0), 0);
    const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
    const vals = Array.from({ length: pts }, rand);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const ys = vals.map(v => 38 - ((v - mn) / (mx - mn)) * 28);
    const xs = vals.map((_, i) => (i / (pts - 1)) * 400);
    const path = xs.map((x, i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const color = open ? 'var(--open)' : 'var(--fg-muted)';
    svg.innerHTML = `
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity=".35"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${path} L400,48 L0,48 Z" fill="url(#sg)"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  /* ── Time logic ── */
  const OPEN_HOUR = 7, CLOSE_HOUR = 18, TZ = 'America/Chicago';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function chicagoDate() {
    const p = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone:TZ, hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'
    }).formatToParts(new Date()).forEach(({type,value}) => p[type]=value);
    return {
      year:parseInt(p.year), month:parseInt(p.month)-1, day:parseInt(p.day),
      hour:parseInt(p.hour)===24?0:parseInt(p.hour),
      minute:parseInt(p.minute), second:parseInt(p.second),
      dowIndex:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoDateOf(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone:TZ, hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'
    }).formatToParts(d).forEach(({type,value}) => p[type]=value);
    return {
      year:parseInt(p.year), month:parseInt(p.month)-1, day:parseInt(p.day),
      hour:parseInt(p.hour)===24?0:parseInt(p.hour),
      minute:parseInt(p.minute), second:parseInt(p.second),
      dowIndex:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)
    };
  }

  function chicagoMidnight(d) {
    const tc = chicagoDateOf(d);
    const offsetStr = new Intl.DateTimeFormat('en-US',{timeZone:TZ,timeZoneName:'shortOffset'})
      .formatToParts(d).find(p=>p.type==='timeZoneName').value;
    const m = offsetStr.match(/GMT([+-])(\d+)(?::(\d+))?/);
    if (!m) return NaN;
    const iso = `${tc.year}-${String(tc.month+1).padStart(2,'0')}-${String(tc.day).padStart(2,'0')}T00:00:00${m[1]}${String(m[2]).padStart(2,'0')}:${String(m[3]||'0').padStart(2,'0')}`;
    return new Date(iso).getTime();
  }

  function isBizDay(d) { return d >= 1 && d <= 5; }
  function isOpen(c)   { return isBizDay(c.dowIndex) && c.hour >= OPEN_HOUR && c.hour < CLOSE_HOUR; }

  function msUntilOpen() {
    const now = new Date();
    for (let d = 0; d <= 6; d++) {
      const trial = new Date(now.getTime() + d * 86400000);
      const tc = chicagoDateOf(trial);
      if (!isBizDay(tc.dowIndex)) continue;
      const openMs = chicagoMidnight(trial) + OPEN_HOUR * 3600000;
      if (openMs > now.getTime()) return openMs - now.getTime();
    }
    return null;
  }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
      .map(n => String(n).padStart(2,'0')).join(':');
  }

  /* ── Hours grid ── */
  (function () {
    const todayDow = chicagoDate().dowIndex;
    const grid = document.getElementById('hoursGrid');
    DAYS.forEach((day, i) => {
      const active = i >= 1 && i <= 5, today = i === todayDow;
      const col = document.createElement('div');
      col.className = 'day-col' + (active ? ' active' : ' off') + (today ? ' today' : '');
      col.innerHTML = `<div class="day-label">${day}</div><div class="day-bar"></div><div class="day-hours">${active ? '7a–6p' : '—'}</div>`;
      grid.appendChild(col);
    });
  })();

  /* ── Tick ── */
  let sparkBuilt = false;

  function tick() {
    const c = chicagoDate();
    const h12 = c.hour % 12 || 12;
    const ampm = c.hour < 12 ? 'AM' : 'PM';
    document.getElementById('liveClock').textContent =
      `${String(h12).padStart(2,'0')}:${String(c.minute).padStart(2,'0')}:${String(c.second).padStart(2,'0')} ${ampm}`;

    const open = isOpen(c);
    if (!sparkBuilt) { buildSparkline(open); sparkBuilt = true; }

    const card    = document.getElementById('statusCard');
    const pill    = document.getElementById('marketPill');
    const heading = document.getElementById('statusHeading');
    const sub     = document.getElementById('statusSub');
    const ctaBtn  = document.getElementById('ctaBtn');
    const cdBlock = document.getElementById('countdownBlock');
    const cdValue = document.getElementById('countdownValue');

    if (open) {
      card.className = 'status-card is-open';
      pill.textContent = 'Market Open';
      heading.textContent = 'Trading is live';
      sub.textContent = 'The paper trading console is running. Place simulated trades and track your portfolio.';
      ctaBtn.hidden = false;
      cdBlock.hidden = true;
    } else {
      card.className = 'status-card is-closed';
      pill.textContent = 'Market Closed';
      heading.textContent = 'Markets are closed';
      sub.textContent = 'The server runs on a scheduled window to keep costs low — weekdays 7 AM to 6 PM CST.';
      ctaBtn.hidden = true;
      cdBlock.hidden = false;
      const ms = msUntilOpen();
      cdValue.textContent = ms ? fmt(ms) : '--:--:--';
    }
  }

  tick();
  setInterval(tick, 1000);
</script>
